<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 546 564" xmlns:bx="https://boxy-svg.com">
  <defs>
    <filter id="drop-shadow-filter-0" bx:preset="drop-shadow 1 0 0 5 0.41 #000" color-interpolation-filters="sRGB" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"></feGaussianBlur>
      <feOffset dx="0" dy="0"></feOffset>
      <feComponentTransfer result="offsetblur">
        <feFuncA id="spread-ctrl" type="linear" slope="0.82"></feFuncA>
      </feComponentTransfer>
      <feFlood flood-color="#000"></feFlood>
      <feComposite in2="offsetblur" operator="in"></feComposite>
      <feMerge>
        <feMergeNode></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
    <filter id="drop-shadow-filter-1" bx:preset="drop-shadow 1 0 0 4 0.41 #000" color-interpolation-filters="sRGB" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"></feGaussianBlur>
      <feOffset dx="0" dy="0"></feOffset>
      <feComponentTransfer result="offsetblur">
        <feFuncA id="spread-ctrl" type="linear" slope="0.82"></feFuncA>
      </feComponentTransfer>
      <feFlood flood-color="#000"></feFlood>
      <feComposite in2="offsetblur" operator="in"></feComposite>
      <feMerge>
        <feMergeNode></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
    <filter id="drop-shadow-filter-2" bx:preset="drop-shadow 1 0 0 4 0.5 #000" color-interpolation-filters="sRGB" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"></feGaussianBlur>
      <feOffset dx="0" dy="0"></feOffset>
      <feComponentTransfer result="offsetblur">
        <feFuncA id="spread-ctrl" type="linear" slope="1"></feFuncA>
      </feComponentTransfer>
      <feFlood flood-color="#000"></feFlood>
      <feComposite in2="offsetblur" operator="in"></feComposite>
      <feMerge>
        <feMergeNode></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>
  <image href="https://dema.ru/why-so-complicated/info.png" width="273" height="500" x="4" style="filter: url(#drop-shadow-filter-2);">
    <bx:title>Анонс и регламент</bx:title>
  </image>
  <image href="https://dema.ru/why-so-complicated/list.png" width="276" height="500" x="140" y="64" style="filter: url(#drop-shadow-filter-1);">
    <bx:title>Участники</bx:title>
  </image>
  <image href="https://dema.ru/why-so-complicated/member.png" width="273" height="500" x="300" style="filter: url(#drop-shadow-filter-0);">
    <bx:title>Участник</bx:title>
  </image>
</svg>
